{{define "register.html"}}
{{template "head.html" .}}
<div class="authbox">
  <h1>注册</h1>
  <form method="post" action="/register">
    <label>昵称(上榜显示名)<input name="name" required autofocus></label>
    <label>密码(至少 6 位)<input name="password" type="password" required></label>
    <label>城市(可选,用于城市榜)<input name="city"></label>
    <button class="btn-primary" type="submit">注册</button>
    <p class="muted">已有账号?<a href="/login">登录</a></p>
  </form>
</div>
{{template "foot.html" .}}
{{end}}
