version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ccusage
    main: ./cmd/ccusage
    binary: ccusage
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/wujunwei/ccusage-go/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ccusage
    builds: [ccusage]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
